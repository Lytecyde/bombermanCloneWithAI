<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reverse Bomberman</title>
    <link rel="stylesheet" href="bomberman.css">
</head>
<body>
    <h1>REVERSE BOMBERMAN</h1>
    <div id="rb-help">Arrow keys / WASD to run. You have no bombs &mdash; just don't get caught in one.</div>
    <div id="rb-hud">
        <div>Survive: <span id="rb-timer">90</span>s</div>
        <div>Bombers left: <span id="rb-bombers">12</span></div>
    </div>

    <div id="rb-game-wrap">
        <canvas id="gameCanvas"></canvas>
        <div id="rb-overlay"></div>
    </div>

    <div id="rb-back"><a href="index.html">&larr; back to Noir City</a></div>

    <script type="module">
        import ReverseBomberman from './ReverseBomberman.js';
        new ReverseBomberman();
    </script>
</body>
</html>
