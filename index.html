<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Noir City</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="score-board">
        <div>Black Agents: <span id="black-score">0</span></div>
        <div>White Agents: <span id="white-score">0</span></div>
        <div>Gray Agents: <span id="gray-score">0</span></div>
        <hr>
        <div>Black Houses Destroyed: <span id="black-destroyed-score">0</span></div>
        <div>White Houses Destroyed: <span id="white-destroyed-score">0</span></div>
    </div>

    <div id="game-over-overlay"></div>

    <div id="mode-switch"><a href="bomberman.html">Play Reverse Bomberman &rarr;</a></div>

    <div id="dialogue-overlay">
        <div id="dialogue-box">
            <div id="dialogue-text"></div>
            <div id="dialogue-options"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import Game from './Game.js';
        new Game();
    </script>
</body>
</html>
